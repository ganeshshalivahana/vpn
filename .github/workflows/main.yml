name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MyVPN-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyVPN-debug-apk
          path: MyVPN-debug.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v2.0.${{ github.run_number }}" MyVPN-debug.apk \
            --title "MyVPN build ${{ github.run_number }}" \
            --notes "Debug APK from commit ${{ github.sha }}."
