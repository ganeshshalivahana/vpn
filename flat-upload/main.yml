name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange project structure
        run: |
          mkdir -p app/src/main/java/com/example/myvpn app/src/main/res/xml
          cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp -f MainActivity.kt ServerStore.kt VpnManager.kt VpnGate.kt app/src/main/java/com/example/myvpn/
          rm -f app/src/main/java/com/example/myvpn/MyVpnService.kt
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="ovpn" path="ovpn/" />
          </paths>
          EOF
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.myvpn"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.myvpn"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "2.1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              kotlinOptions { jvmTarget = "17" }
              packaging { jniLibs.useLegacyPackaging = true }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
              implementation("com.wireguard.android:tunnel:1.0.20230706")
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - run: cp app/build/outputs/apk/debug/app-debug.apk MyVPN-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyVPN-debug-apk
          path: MyVPN-debug.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v2.1.${{ github.run_number }}" MyVPN-debug.apk \
            --title "MyVPN build ${{ github.run_number }}" \
            --notes "Debug APK from commit ${{ github.sha }}."
